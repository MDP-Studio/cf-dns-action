name: Auto-build dist

# When source changes land on main without a corresponding dist/ update, rebuild
# and commit. CI's dist-drift check fails PRs that skip this; this workflow is
# the safety net for direct pushes to main. `workflow_dispatch` also lets it be
# run against a PR branch to fix cross-platform sourcemap drift (e.g. when dist/
# was built on Windows and CI runs on Linux).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

jobs:
  build:
    # Skip when the previous run already pushed a rebuild (avoid loops).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dist_changed: ${{ steps.dist_diff.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Check dist/ changes
        id: dist_diff
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain dist/)" ]; then
            echo "dist/ already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload rebuilt dist/
        if: steps.dist_diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuilt-dist
          path: dist/

  commit-dist:
    needs: build
    if: needs.build.outputs.dist_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove existing dist/
        run: rm -rf dist

      - name: Download rebuilt dist/
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rebuilt-dist
          path: dist/

      - name: Commit dist/ if changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain dist/)" ]; then
            echo "dist/ already up to date after artifact restore"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "chore: rebuild dist/ [skip ci]"
          git push
